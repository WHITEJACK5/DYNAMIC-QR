name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-must-be-32-chars-long
          BASE_URL: http://localhost:5000
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no hardcoded secret
        run: |
          if grep -R "nare-co-secret-2026" --include="*.py" .; then echo "Hardcoded secret found!"; exit 1; fi
          echo "No hardcoded secret"
