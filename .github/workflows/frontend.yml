name: Frontend (Phase 8)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Phase 8c: linting and formatting are enforced, not optional.
      - name: ESLint (zero warnings allowed)
        run: npm run lint
      - name: Prettier (check, do not write)
        run: npm run format:check
      - name: TypeScript (no errors, no unused locals)
        run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: The build output exists and is not empty
        run: |
          test -d dist || { echo "FAIL: no dist/"; exit 1; }
          test -f dist/index.html || { echo "FAIL: no dist/index.html"; exit 1; }
          echo "build output present"
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  lighthouse:
    # Phase 8d: "Lighthouse CI in the pipeline with a score threshold that
    # fails the build if regressed."
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Serve the build
        run: |
          cd frontend && npx vite preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
      - name: Lighthouse CI with a hard threshold
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --collect.url=http://localhost:4173/ \
            --assert.preset=lighthouse:recommended \
            --assert.assertions."categories:accessibility"=error \
            --assert.assertions."categories:best-practices"=error \
            --assert.assertions."categories:performance"=warn
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
