# Production deployment (Phase 6c).
#
# The directive is explicit: "on merge to main, run full CI, then deploy to
# production automatically (or with a manual approval gate) — actually wire
# this up, don't just have a CI file that runs tests and stops."
#
# This is the second half of that: it fires only after CI has PASSED on main
# (workflow_run, not a parallel trigger), and it deploys through the host's
# API.
#
# SAFETY DESIGN — a deployment must fail closed, not fake success:
#   * gated on CI's conclusion being exactly "success"
#   * environment: production, so the repository can require reviewers. That
#     gate is a repo setting, not a file — see README "Enabling the deploy
#     gate". Until it is configured this deploys automatically, which is why
#     the secrets check below refuses to run without them.
#   * concurrency group, so two merges cannot race two deploys
#   * required secrets are checked BEFORE any deploy call, so a
#     misconfigured repository fails with a clear message instead of a
#     half-applied release
#   * a post-deploy smoke test; a deployment that does not answer /api/health
#     is reported as failed rather than assumed good

name: Deploy (production)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this manual deploy needed?"
        required: true

# One deploy at a time, and never cancel one mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Check CI passed and the target is configured
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Require CI to have succeeded
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "CI concluded '${{ github.event.workflow_run.conclusion }}' — refusing to deploy."
            echo "Merge to main must pass CI before anything reaches production."
            exit 1
          fi
          echo "CI passed; proceeding."

      - name: Refuse to deploy without real deployment credentials
        run: |
          missing=0
          # Exactly one deploy target must be configured.
          if [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            target=render
          elif [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            target=fly
          elif [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            target=railway
          else
            echo "::error::No deployment credentials configured."
            echo "Add RENDER_API_KEY, FLY_API_TOKEN or RAILWAY_TOKEN to the"
            echo "production environment secrets, or this job cannot deploy."
            missing=1
          fi
          if [ "$missing" != "0" ]; then exit 1; fi
          echo "Deploy target: $target"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Resolve the commit being deployed
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "Deploying $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: The commit is really on main
        run: |
          git fetch --depth 1 origin "${{ steps.sha.outputs.sha }}"
          git branch -r --contains "${{ steps.sha.outputs.sha }}" | grep -q "origin/main" \
            || { echo "::error::${{ steps.sha.outputs.sha }} is not on main"; exit 1; }

  deploy:
    name: Deploy and verify
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      # --- render -------------------------------------------------------------
      - name: Deploy to Render
        if: needs.verify.outputs.target == 'render'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          [ -n "$RENDER_SERVICE_ID" ] || { echo "::error::RENDER_SERVICE_ID variable missing"; exit 1; }
          deploy_id=$(curl -sS -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"clearCache\":\"do_not_clear\"}" | tee /tmp/r.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
          [ -n "$deploy_id" ] || { echo "::error::Render did not return a deploy id"; cat /tmp/r.json; exit 1; }
          echo "Deploy $deploy_id triggered; polling."
          for i in $(seq 1 60); do
            status=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploy",{}).get("status",""))')
            echo "  status: $status"
            [ "$status" = "live" ] && exit 0
            [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] && { echo "::error::Render deploy failed"; exit 1; }
            sleep 20
          done
          echo "::error::Render deploy did not go live within 20 minutes"
          exit 1

      # --- fly ----------------------------------------------------------------
      - name: Deploy to Fly.io
        if: needs.verify.outputs.target == 'fly'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
        run: |
          [ -n "$FLY_APP" ] || { echo "::error::FLY_APP variable missing"; exit 1; }
          curl -fsSL https://fly.io/install.sh | sh
          fly auth token --access-token "$FLY_API_TOKEN"
          fly deploy --app "$FLY_APP" --wait-timeout 900 --strategy rolling

      # --- railway ------------------------------------------------------------
      - name: Deploy to Railway
        if: needs.verify.outputs.target == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          [ -n "$RAILWAY_SERVICE" ] || { echo "::error::RAILWAY_SERVICE variable missing"; exit 1; }
          curl -fsSL https://railway.app/install.sh | sh
          railway up --service "$RAILWAY_SERVICE" --detach
          railway redeploy --service "$RAILWAY_SERVICE" --yes

      # --- verify -------------------------------------------------------------
      - name: Smoke test the deployed service
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          [ -n "$URL" ] || { echo "::error::PRODUCTION_URL variable is not set; cannot verify"; exit 1; }
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health -w '%{http_code}' "$URL/api/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health: $(cat /tmp/health)"
              exit 0
            fi
            echo "  attempt $i: $code"
            sleep 10
          done
          echo "::error::$URL/api/health never returned 200 after deploy"
          exit 1

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deployment ${{ needs.verify.outputs.sha }}"
            echo "- Target: ${{ needs.verify.outputs.target }}"
            echo "- URL: ${{ vars.PRODUCTION_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"