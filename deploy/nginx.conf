# DR & CO. — reverse proxy in front of gunicorn (Phase 2h).
#
# Topology: client -> nginx (TLS, compression, static, rate limit) -> gunicorn
# (wsgi:application, bound to loopback) -> app/... (Postgres + Redis optional)
#
# gunicorn must NOT be exposed directly: it speaks plain HTTP and trusts
# X-Forwarded-For for rate limiting, so it only binds 127.0.0.1 behind this.
#
#   gunicorn wsgi:application -w 4 -b 127.0.0.1:5000 --access-logfile -
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/DR && \
#        ln -s /etc/nginx/sites-available/DR /etc/nginx/sites-enabled/ && \
#        nginx -t && systemctl reload nginx

upstream DR_app {
    server 127.0.0.1:5000 fail_timeout=0;
    keepalive 16;
}

# Coarse edge limit as a second layer; the app also limits per endpoint
# (Flask-Limiter). Keyed on the real client IP. Declared at file scope, which
# lands in the http{} context because sites-enabled/* is included there.
limit_req_zone $binary_remote_addr zone=DR_api:10m rate=20r/s;

server {
    listen 80;
    server_name DR.example.com;

    # ACME challenge for certificate renewal
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name DR.example.com;

    ssl_certificate     /etc/letsencrypt/live/DR.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DR.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logo uploads are capped at 5MB; the app allows 16MB overall.
    client_max_body_size 16m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets are cacheable; the app version is what busts them.
    location /static/ {
        alias /srv/DR/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        proxy_pass http://DR_app/api/health;
        access_log off;
    }

    location /api/ {
        limit_req zone=DR_api burst=40 nodelay;
        proxy_pass http://DR_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # QR redirects are the hot path: never buffer, never cache (per-scan counts).
    location /r/ {
        proxy_pass http://DR_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://DR_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
