# DRQR — full local stack: app + PostgreSQL + Redis (Phase 6a).
#
#   cp .env.example .env      # the only manual step
#   docker compose up --build
#   open http://localhost:8000
#
# The directive's definition of done is "a fresh clone can be brought up with
# docker-compose up and no manual steps beyond copying an .env.example", so
# this file is part of the contract, not a convenience:
#   * every variable has a default that works on a laptop, so .env can be
#     copied verbatim and left alone
#   * no secret is committed; compose reads them from .env
#   * services wait for real readiness (healthchecks + depends_on), so the
#     first migrate does not race an unstarted database
#
# Note on ports: Postgres and Redis are NOT published to the host by default.
# Only the app is. In a real deployment they stay on an internal network; on a
# laptop, uncomment the ports block if you want to inspect them.

name: DR

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dev-only credentials. A real deployment injects these from the
      # platform's secret store; see README "Secrets".
      POSTGRES_USER: ${POSTGRES_USER:-DR}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DR_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-DR}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d/-U so readiness does not depend on psql finding a default cluster.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-DR} -d ${POSTGRES_DB:-DR}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Uncomment to inspect the database from the host.
    # ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate limiting, the job queue and the cache all use this. An in-memory
    # store would make rate limits and revocations per-process, which is
    # exactly the bug Phase 4f/4c documented.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    # ports: ["6379:6379"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Compose interpolation: these come from .env, never from a committed
      # file. APP_ENV=production is what makes the app refuse to fall back to
      # local disk for logos and refuse to run without a secret (Phase 3d/4g).
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - copy .env.example to .env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-DR}:${POSTGRES_PASSWORD:-DR_dev_password}@db:5432/${POSTGRES_DB:-DR}
      REDIS_URL: redis://redis:6379/0
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      # Object storage for logos (Phase 3d). With no bucket, logo uploads
      # return 503 rather than writing to the container's ephemeral disk.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-no-reply@drqr.com}
      # Never "1" in production: it enables the Werkzeug debugger.
      FLASK_DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Background jobs (Phase 2f): geo-IP enrichment and bulk CSV generation.
  # Separate from `app` because a long bulk job must not occupy a web worker.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - copy .env.example to .env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-DR}:${POSTGRES_PASSWORD:-DR_dev_password}@db:5432/${POSTGRES_DB:-DR}
      REDIS_URL: redis://redis:6379/0
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      IPAPI_URL: ${IPAPI_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # The image's default CMD is gunicorn; the worker overrides it.
    #
    # `rq worker`, not `python -m rq worker`: rq ships no __main__, so
    # `python -m rq` fails with "No module named rq.__main__" and the worker
    # crash-loops. The Procfile had the same mistake.
    command: ["rq", "worker", "DR", "--url", "redis://redis:6379/0"]
    healthcheck:
      # rq has no endpoint; assert the process is alive rather than pretend.
      test: ["CMD-SHELL", "pgrep -f 'rq worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  redisdata: